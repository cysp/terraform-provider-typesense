version: "2"

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - exhaustruct_v5
    - funlen
    - goconst
    - gomodguard
    - lll
    - wsl
  settings:
    cyclop:
      max-complexity: 20
    varnamelen:
      ignore-names:
        - i
        - k
        - ok
        - r
        - t
        - v
        - w
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: '_test\.go$'
        text: "dot-imports: should not use dot imports"
      - linters:
          - gochecknoglobals
        path: '_test\.go$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
